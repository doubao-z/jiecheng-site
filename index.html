<head>

<title>节程安全 JIECHENG</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0b0d;--panel:#151518;--line:#26262b;--ink:#f2f2f5;--muted:#9a9aa5;--red:#ff2d2d;--cyan:#00e5ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui;background:var(--bg);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased}
.nav{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:700;letter-spacing:1px}.brand b{color:var(--red)}
.nav-r{display:flex;gap:18px;font-size:13px;color:#888}.nav-r a{color:#888;text-decoration:none}.nav-r a:hover{color:var(--ink)}
.hero{max-width:1080px;margin:0 auto;padding:54px 24px 36px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.18;margin-bottom:16px}.hero h1 em{font-style:normal;color:var(--red)}
.lead{font-size:15px;color:var(--muted);max-width:520px;margin-bottom:24px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;height:48px;padding:0 28px;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none}
.btn-main{background:var(--red);color:#fff}.btn-sub{border:1px solid var(--line);color:var(--ink);background:transparent}.btn-forum{background:var(--cyan);color:#000}
.shield{width:100%;aspect-ratio:1/1;background:radial-gradient(circle at 50% 35%,#1d1d22,#0b0b0d 70%);border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden}
.shield:before{content:"";position:absolute;inset:18% 30%;border:2px solid var(--red);border-radius:14px 14px 60px 60px;opacity:.85}
.shield:after{content:"JC";position:absolute;left:0;right:0;top:42%;text-align:center;font-size:42px;font-weight:900;color:var(--cyan);letter-spacing:2px}
.stats{max-width:1080px;margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{display:block;font-size:22px;color:var(--cyan)}.stat span{font-size:12.5px;color:var(--muted)}
.sec{max-width:1080px;margin:0 auto;padding:40px 24px;border-top:1px solid var(--line)}
.sec h2{font-size:22px;font-weight:700;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;border-left:3px solid var(--red)}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:8px}.card p{font-size:13.5px;color:var(--muted);line-height:1.75}
footer{max-width:1080px;margin:0 auto;padding:40px 24px 56px;font-size:12.5px;color:#666;text-align:center}
</style>
</head>
<body>
<nav>
  <div class="brand">节程<b>安全</b> · JIECHENG</div>
  <div class="nav-r"><a href="./forum.html">论坛</a><span style="font-size:11px;background:var(--cyan);color:#000;padding:3px 10px;border-radius:999px;font-weight:700">v1.3.1</span></div>
</nav>
<section class="hero">
  <div>
    <h1>安卓上的<em>节程工具套件</em><br>防护客户端 + 桌面启动器。</h1>
    <p class="lead">节程安全做安卓端轻量工具分发：节程安全客户端负责扫描与自查，节程启动器负责快速启动与隐藏入口。</p>
    <div class="btn-row">
      <a class="btn btn-main" href="./jiecheng-1.3.1.apk" download>下载 节程安全 1.3.1</a>
      <a class="btn btn-sub" href="./jiecheng-launcher-1.1.apk" download>下载 节程启动器 1.1</a>
      <a class="btn btn-forum" href="./forum.html">进入论坛</a>
    </div>
  </div>
  <div class="shield"></div>
</section>
<section class="stats">
  <div class="stat"><b>Android 9+</b><span>最低支持系统</span></div>
  <div class="stat"><b>2 款产品</b><span>防护 + 启动器</span></div>
  <div class="stat"><b>本地优先</b><span>不强制账号</span></div>
</section>
<footer>© 2026 节程安全 · 就和一言一</footer>
</body>
</html>
